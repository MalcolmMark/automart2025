<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up - AutoMart</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Simple nav header -->
<header>
  <div class="brand">AutoMart</div>
  <nav>
    <a href="signup.html">Sign Up</a>
    <a href="signin.html">Sign In</a>
    <a href="post_car.html">Post Ad</a>
    <a href="index.html">Marketplace</a>
    <a href="orders.html">Orders</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<section class="main-card">
  <h1>Create Account</h1>
  <h2>Sell or buy trusted cars</h2>

  <form id="signupForm">
    <div class="form-group">
      <label>Email</label>
      <input name="email" type="email" required placeholder="you@example.com" />
    </div>

    <div class="form-group">
      <label>First name</label>
      <input name="first_name" required />
    </div>

    <div class="form-group">
      <label>Last name</label>
      <input name="last_name" required />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input name="password" type="password" required />
    </div>

    <div class="form-group">
      <label>Address</label>
      <input name="address" required placeholder="City / Location" />
    </div>

    <div class="form-group">
      <label>Admin?</label>
      <select name="is_admin">
        <option value="false">No (buyer/seller)</option>
        <option value="true">Yes (admin)</option>
      </select>
    </div>

    <button class="primary-btn" type="submit">Sign Up</button>
  </form>

  <div id="signupFeedback" class="feedback-box"></div>
</section>

<script>
/*
 When you connect frontend to backend later:
 - This form should POST to /api/v1/auth/signup with JSON body
   {
     email, first_name, last_name, password, address, is_admin
   }
 - The backend will respond with { status, data: { token, id, ... } }
 (This flow is required by the challenge.)  :contentReference[oaicite:0]{index=0}
*/

document.getElementById('signupForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());

  // For now we're not calling the API yet.
  // We just show what WOULD be sent.
  document.getElementById('signupFeedback').textContent =
    "✅ Ready to POST /api/v1/auth/signup with: " + JSON.stringify(data);
});
</script>

</body>
</html>
